name: Daily digest

on:
  schedule:
    # GitHub cron is UTC, best-effort and can be late or skipped under load. Each slot therefore has
    # backup triggers; --once-per-slot makes them no-ops once that slot's digest has been sent.
    # Morning 08:50 / 09:20 / 09:50 KST
    - cron: "50 23 * * *"
    - cron: "20 0 * * *"
    - cron: "50 0 * * *"
    # Midday 13:50 / 14:20 KST
    - cron: "50 4 * * *"
    - cron: "20 5 * * *"
    # Evening 20:50 / 21:20 KST
    - cron: "50 11 * * *"
    - cron: "20 12 * * *"
  workflow_dispatch:
    inputs:
      slot:
        description: "Digest slot"
        type: choice
        options: [auto, morning, midday, evening]
        default: auto
      once:
        description: "Skip if this slot was already sent today (used by the external cron trigger)"
        type: boolean
        default: false

concurrency:
  group: digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TIMEZONE: Asia/Seoul
      LLM_PROVIDER: gemini
      DIGEST_LANGUAGE: ru
      DIGEST_MAX_WORDS: "800"
      NEWS_MAX: "10"
      JOBS_MAX: "8"
      LMS_HEADLESS: "true"
      LMS_INSTANCES: smart,nsmart
      LMS_SMART_KIND: moodle
      LMS_SMART_URL: https://smart.wsu.ac.kr
      # Students log in via the university SSO: "SSO login" → switch to ENG (if still KOR) → "ID Number Login"
      # tab; afterwards dismiss the "change your password" prompt with "Change Next" (a.btnNo)
      LMS_SMART_PRE_LOGIN_CLICKS: "a.btn-login-type-sso|?label[for=language-toggle]:has(~ #korType.on)|text=ID Number Login"
      LMS_SMART_POST_LOGIN_CLICKS: "a.btnNo"
      LMS_SMART_USERNAME_SELECTOR: "#iuser_id"
      LMS_SMART_PASSWORD_SELECTOR: "#iuser_password"
      LMS_SMART_SUBMIT_SELECTOR: 'button:text-is("Login"):visible'
      LMS_NSMART_KIND: canvas
      LMS_NSMART_URL: https://nsmart.wsu.ac.kr
      LMS_NSMART_USERNAME_SELECTOR: "#pseudonym_session_unique_id"
      LMS_NSMART_PASSWORD_SELECTOR: "#pseudonym_session_password"
      LMS_NSMART_SUBMIT_SELECTOR: "input[name=commit]"
      # Secrets (Settings → Secrets and variables → Actions)
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      HH_APP_TOKEN: ${{ secrets.HH_APP_TOKEN }}
      LMS_SMART_USERNAME: ${{ secrets.LMS_SMART_USERNAME }}
      LMS_SMART_PASSWORD: ${{ secrets.LMS_SMART_PASSWORD }}
      LMS_NSMART_USERNAME: ${{ secrets.LMS_NSMART_USERNAME }}
      LMS_NSMART_PASSWORD: ${{ secrets.LMS_NSMART_PASSWORD }}
      LMS_NSMART_TOKEN: ${{ secrets.LMS_NSMART_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Cache Playwright browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      # State between runs: SQLite (seen items, LMS snapshot, changes) + LMS browser sessions.
      # It holds session cookies, so the cache only ever contains an AES-256 encrypted archive.
      - name: Check encryption key
        env:
          STATE_KEY: ${{ secrets.STATE_KEY }}
        run: test -n "$STATE_KEY" || { echo "::error::STATE_KEY secret is missing"; exit 1; }

      - name: Restore encrypted state
        uses: actions/cache/restore@v4
        with:
          path: state
          key: state-${{ github.run_id }}
          restore-keys: state-

      - name: Decrypt state
        env:
          STATE_KEY: ${{ secrets.STATE_KEY }}
        run: |
          if [ -f state/data.tar.gz.enc ]; then
            openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in state/data.tar.gz.enc -pass env:STATE_KEY | tar xz
            echo "State restored"
          else
            echo "No previous state, starting fresh"
          fi

      - name: Build and send digest
        # Manual runs always send. Scheduled runs and the external cron-job.org trigger (once=true) send each
        # slot at most once a day, so whichever fires first wins and the others are no-ops.
        run: >-
          python -m app digest ${{ inputs.slot || 'auto' }} --refresh-lms --skip-empty
          ${{ (github.event_name == 'schedule' || inputs.once) && '--once-per-slot' || '' }}

      - name: Encrypt state
        if: always()
        env:
          STATE_KEY: ${{ secrets.STATE_KEY }}
        run: |
          mkdir -p state data
          rm -f state/data.tar.gz.enc
          tar cz data | openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -out state/data.tar.gz.enc -pass env:STATE_KEY

      - name: Save encrypted state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state
          key: state-${{ github.run_id }}-${{ github.run_attempt }}
